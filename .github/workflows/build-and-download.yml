name: Build and Download Image

on:
  push:
    branches: [ "main" ] # 👈 改成你修改代码所在的分支
  workflow_dispatch: # 允许手动点击触发

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Get current date
        id: date
        run: |
          # 获取北京时间，格式如 20261106
          TODAY=$(TZ='Asia/Shanghai' date +%Y%m%d)
          # 将日期写入 GitHub 环境变量，供后续步骤使用
          echo "TODAY=$TODAY" >> $GITHUB_ENV
          echo "今天的日期标签是: $TODAY"

      - name: Build Docker image
        run: |
          # 同时打上日期标签和 latest 标签
          docker build -t databasus-custom:${{ env.TODAY }} -t databasus-custom:latest .

      - name: Save and compress Docker image
        run: |
          # 导出镜像时，把日期标签和 latest 标签都包含进去
          # 导出文件名也带上日期，方便你下载后区分
          docker save databasus-custom:${{ env.TODAY }} databasus-custom:latest | gzip > databasus-custom-image-${{ env.TODAY }}.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # Artifact 的名字也带上日期
          name: databasus-image-${{ env.TODAY }}
          path: databasus-custom-image-${{ env.TODAY }}.tar.gz
          retention-days: 7 
